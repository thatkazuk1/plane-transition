name: "plane-transition"
description: "Scan text for Plane work-item references and transition them to a target state."
author: "thatkazuk1"

inputs:
  plane-base-url:
    description: "Plane instance base URL, without /api/v1"
    required: false
    default: "https://api.plane.so"
  plane-workspace-slug:
    description: "Plane workspace slug"
    required: true
  plane-api-token:
    description: "Plane workspace-scoped API token"
    required: true
  text:
    description: "Text to scan for work-item references (e.g. PR title + body)"
    required: true
  identifier-prefixes:
    description: "Comma-separated project identifier prefixes to restrict matches to (empty = any)"
    required: false
    default: ""
  target-state:
    description: "Target state name or group to transition matched work items to"
    required: false
    default: "Done"
  keywords:
    description: "Comma-separated closing keywords required before a reference"
    required: false
    default: "close,closes,closed,fix,fixes,fixed,resolve,resolves,resolved,complete,completes,completed"
  require-keyword:
    description: "Require a closing keyword before a reference is matched"
    required: false
    default: "true"
  dry-run:
    description: "Do not perform any mutations; log the planned transitions"
    required: false
    default: "false"
  fail-on-error:
    description: "Fail the step on hard errors (network/auth/unresolvable state); 404-skips never fail"
    required: false
    default: "false"
  pr-url:
    description: "PR URL to attach as a link on each transitioned work item (empty = don't link)"
    required: false
    default: ""

outputs:
  transitioned:
    description: "JSON array of {identifier, from_state, to_state, status, dry_run}"

runs:
  using: "docker"
  # Pinned to the published image's immutable digest rather than building
  # from Dockerfile at each use — consumers pin this action to a git ref
  # (e.g. @v1.0.1), and that ref always resolves to this exact image.
  image: "docker://ghcr.io/thatkazuk1/plane-transition@sha256:ebddf94a0beaa12a4cb94dc76a01392eee2f19b0238e982e44ab82aad09fee8f"
  env:
    PLANE_BASE_URL: ${{ inputs.plane-base-url }}
    PLANE_WORKSPACE_SLUG: ${{ inputs.plane-workspace-slug }}
    PLANE_API_TOKEN: ${{ inputs.plane-api-token }}
    PT_TEXT: ${{ inputs.text }}
    PT_PREFIXES: ${{ inputs.identifier-prefixes }}
    PT_TARGET_STATE: ${{ inputs.target-state }}
    PT_KEYWORDS: ${{ inputs.keywords }}
    PT_REQUIRE_KEYWORD: ${{ inputs.require-keyword }}
    PT_DRY_RUN: ${{ inputs.dry-run }}
    PT_FAIL_ON_ERROR: ${{ inputs.fail-on-error }}
    PT_PR_URL: ${{ inputs.pr-url }}

branding:
  icon: "git-merge"
  color: "purple"
