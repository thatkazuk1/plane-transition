name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags
        id: meta
        run: |
          version="${GITHUB_REF_NAME#v}"
          major="${version%%.*}"
          sha_short="${GITHUB_SHA:0:7}"
          {
            echo "version=$version"
            echo "major_tag=v${major}"
            echo "sha_tag=sha-${sha_short}"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/plane-transition:v${{ steps.meta.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/plane-transition:${{ steps.meta.outputs.major_tag }}
            ghcr.io/${{ github.repository_owner }}/plane-transition:${{ steps.meta.outputs.sha_tag }}
