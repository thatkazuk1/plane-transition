name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install ruff pytest plane-sdk==0.2.23

      - name: Lint
        run: ruff check src/ tests/

      - name: Test
        run: pytest tests/ -v
